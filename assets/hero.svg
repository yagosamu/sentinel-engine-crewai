<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 660" width="1600" height="660">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090f"/>
      <stop offset="100%" stop-color="#0d0b1a"/>
    </linearGradient>

    <linearGradient id="crewFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a1f4d" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#3b2a6b" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#2a1f4d" stop-opacity="0.55"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <marker id="aCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <marker id="aAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#eab308"/>
    </marker>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/>
    </marker>
    <marker id="aTick" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5675"/>
    </marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="1600" height="660" fill="url(#bg)"/>

  <!-- ══ headline ══ -->
  <text x="46" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#f2f4f8">
    One deterministic pipeline. <tspan fill="#eab308">One autonomous crew.</tspan>
  </text>
  <text x="46" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#a78bfa">
    One ground-truth score.
  </text>

  <text x="46" y="164" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#8b93a7">
    Left to right: the generator seeds PostgreSQL → Dagster ingests → dbt builds the medallion → DuckDB serves it → FastAPI exposes it over MCP.
  </text>
  <text x="46" y="186" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#8b93a7">
    Above it all, the CrewAI Sentinel watches every stage — and is graded against a ledger it never sees.
  </text>

  <!-- ══ layer 6 · sentinel crew ══ -->
  <rect x="50" y="222" width="1500" height="96" rx="16" fill="url(#crewFill)" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="72" y="248" font-family="'Consolas', 'SF Mono', monospace" font-size="10" fill="#c4b5fd" letter-spacing="1.6">LAYER 6 · AUTONOMOUS DATAOPS · CREWAI SENTINEL</text>
  <text x="1528" y="248" text-anchor="end" font-family="'Consolas', 'SF Mono', monospace" font-size="10" fill="#c4b5fd" letter-spacing="1.6">DETECT · DIAGNOSE · REMEDIATE ↓</text>
  <text x="800" y="282" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#f2f4f8">Sentinel — Hierarchical Crew</text>
  <text x="800" y="304" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#a99fd0">Manager · Log Analyst · Data Profiler · Data Engineer · Incident Commander</text>

  <!-- ══ stage chips ══ -->
  <g font-family="'Consolas', 'SF Mono', monospace" font-size="10" letter-spacing="1.3" text-anchor="middle">
    <rect x="70"   y="356" width="136" height="21" rx="5" fill="#0d2b30" stroke="#155e63" stroke-width="1"/>
    <text x="138"  y="371" fill="#67e8f9">00 · GENERATOR</text>

    <rect x="292"  y="356" width="122" height="21" rx="5" fill="#2b230b" stroke="#6b5312" stroke-width="1"/>
    <text x="353"  y="371" fill="#fcd34d">01 · SOURCE</text>

    <rect x="510"  y="356" width="122" height="21" rx="5" fill="#0f1f3d" stroke="#1e3a72" stroke-width="1"/>
    <text x="571"  y="371" fill="#93c5fd">02 · INGEST</text>

    <rect x="722"  y="356" width="146" height="21" rx="5" fill="#0f1f3d" stroke="#1e3a72" stroke-width="1"/>
    <text x="795"  y="371" fill="#93c5fd">03 · TRANSFORM</text>

    <rect x="940"  y="356" width="150" height="21" rx="5" fill="#0f1f3d" stroke="#1e3a72" stroke-width="1"/>
    <text x="1015" y="371" fill="#93c5fd">04 · WAREHOUSE</text>

    <rect x="1156" y="356" width="164" height="21" rx="5" fill="#0c2716" stroke="#166534" stroke-width="1"/>
    <text x="1238" y="371" fill="#86efac">05 · INTELLIGENCE</text>
  </g>

  <!-- ══ chip → box connectors ══ -->
  <g stroke="#4b5675" stroke-width="1.1" stroke-dasharray="3 4" marker-end="url(#aTick)">
    <path d="M138 379 V 407"/>
    <path d="M353 379 V 407"/>
    <path d="M571 379 V 407"/>
    <path d="M795 379 V 407"/>
    <path d="M1015 379 V 407"/>
    <path d="M1238 379 V 407"/>
  </g>

  <!-- ══ pipeline stages ══ -->
  <!-- 00 generator -->
  <rect x="50" y="414" width="175" height="150" rx="13" fill="#08171b" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="66" y="440" font-family="'Consolas', 'SF Mono', monospace" font-size="9" fill="#22d3ee" letter-spacing="1.1">FAKER · 14 MODES</text>
  <text x="137" y="486" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#f2f4f8">Synthetic</text>
  <text x="137" y="510" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#f2f4f8">Generator</text>
  <text x="137" y="536" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#7b8496">traffic · failures</text>

  <!-- 01 postgres -->
  <rect x="270" y="414" width="175" height="150" rx="13" fill="#191305" stroke="#eab308" stroke-width="1.5"/>
  <text x="286" y="440" font-family="'Consolas', 'SF Mono', monospace" font-size="9" fill="#eab308" letter-spacing="1.1">TRANSACTIONAL</text>
  <text x="357" y="492" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#f2f4f8">PostgreSQL</text>
  <text x="357" y="519" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#7b8496">customers · orders</text>
  <text x="357" y="536" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#7b8496">products · payments</text>

  <!-- 02 dagster -->
  <rect x="490" y="414" width="175" height="150" rx="13" fill="#080e1c" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="506" y="440" font-family="'Consolas', 'SF Mono', monospace" font-size="9" fill="#60a5fa" letter-spacing="1.1">INCREMENTAL</text>
  <text x="577" y="492" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#f2f4f8">Dagster</text>
  <text x="577" y="519" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#7b8496">extract · watermark</text>

  <!-- 03 dbt -->
  <rect x="710" y="414" width="175" height="150" rx="13" fill="#080e1c" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="726" y="440" font-family="'Consolas', 'SF Mono', monospace" font-size="9" fill="#60a5fa" letter-spacing="1.1">MEDALLION</text>
  <text x="797" y="492" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#f2f4f8">dbt</text>
  <text x="797" y="519" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#7b8496">bronze → silver → gold</text>
  <text x="797" y="536" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#7b8496">quarantine, never drop</text>

  <!-- 04 duckdb -->
  <rect x="930" y="414" width="175" height="150" rx="13" fill="#080e1c" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="946" y="440" font-family="'Consolas', 'SF Mono', monospace" font-size="9" fill="#93c5fd" letter-spacing="1.1">ANALYTICAL</text>
  <text x="1017" y="492" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#f2f4f8">DuckDB</text>
  <text x="1017" y="519" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#7b8496">gold OBTs</text>

  <!-- 05 mcp -->
  <g filter="url(#glow)">
    <rect x="1150" y="414" width="175" height="150" rx="13" fill="#06170d" stroke="#22c55e" stroke-width="1.6"/>
  </g>
  <text x="1166" y="440" font-family="'Consolas', 'SF Mono', monospace" font-size="9" fill="#4ade80" letter-spacing="1.1">FASTAPI · MCP</text>
  <text x="1237" y="486" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#f2f4f8">MCP Server</text>
  <text x="1237" y="513" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#7b8496">3 read-only tools</text>
  <text x="1237" y="530" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#7b8496">over gold</text>

  <!-- consumer -->
  <rect x="1370" y="430" width="180" height="118" rx="13" fill="#080d18" stroke="#3b82f6" stroke-width="1.3" stroke-dasharray="6 5" opacity="0.85"/>
  <text x="1460" y="456" text-anchor="middle" font-family="'Consolas', 'SF Mono', monospace" font-size="9" fill="#60a5fa" letter-spacing="1.1">MCP CLIENT</text>
  <text x="1460" y="492" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#cdd4e2">Claude</text>
  <text x="1460" y="514" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#cdd4e2">Desktop</text>

  <!-- ══ flow arrows ══ -->
  <path d="M231 489 H 262" stroke="#22d3ee" stroke-width="2.2" marker-end="url(#aCyan)"/>
  <path d="M451 489 H 482" stroke="#eab308" stroke-width="2.2" marker-end="url(#aAmber)"/>
  <path d="M671 489 H 702" stroke="#3b82f6" stroke-width="2.2" marker-end="url(#aBlue)"/>
  <path d="M891 489 H 922" stroke="#3b82f6" stroke-width="2.2" marker-end="url(#aBlue)"/>
  <path d="M1111 489 H 1142" stroke="#60a5fa" stroke-width="2.2" marker-end="url(#aBlue)"/>
  <path d="M1331 489 H 1362" stroke="#22c55e" stroke-width="2.2" marker-end="url(#aGreen)"/>

  <!-- ══ oracle loop: ledger → crew ══ -->
  <path d="M225 468 H 239 Q 247 468 247 460 V 324"
        fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="4 5" opacity="0.8" marker-end="url(#aPurple)"/>
  <rect x="258" y="326" width="228" height="21" rx="5" fill="#140f26" stroke="#4c3d7a" stroke-width="1"/>
  <text x="372" y="341" text-anchor="middle" font-family="'Consolas', 'SF Mono', monospace" font-size="10" fill="#c4b5fd" letter-spacing="0.6">I4 · ground truth → scoring oracle</text>

  <!-- ══ interface footer ══ -->
  <line x1="50" y1="600" x2="1550" y2="600" stroke="#1c2333" stroke-width="1"/>
  <text x="50" y="626" font-family="'Consolas', 'SF Mono', monospace" font-size="11" fill="#6b7488" letter-spacing="0.4">
    I1 Dagster failure logs · I2 dbt run_results · I3 DuckDB warehouse · I4 injected_incidents (ground truth) · I5 incident RAG
  </text>
  <text x="1550" y="626" text-anchor="end" font-family="'Consolas', 'SF Mono', monospace" font-size="11" fill="#6b7488" letter-spacing="0.4">
    Component A never depends on Component B
  </text>
</svg>
